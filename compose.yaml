services:
  backend:
    build: .
    environment:
      DATABASE_URL: "mysql://root:password@database:3306/todo_app"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8
    ports:
    - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: todo_app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
